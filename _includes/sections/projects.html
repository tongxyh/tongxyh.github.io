<h1>Projects</h1>

{% for direction in site.data.index.projects %}
<section class="research-project-group">
    <div class="research-project-heading">
        <h2>{{ direction.name }}</h2>
        <p>{{ direction.descr }}</p>
    </div>
    <div class="research-project-grid">
        {% for project in direction.projects %}
        <article class="research-project">
            <h3>{{ project.name }}</h3>
            <p>{{ project.descr }}</p>
            <a href="{{ project.github }}" target="_blank" rel="noopener noreferrer"><i class="fa fa-fw fa-github" aria-hidden="true"></i>GitHub</a>
        </article>
        {% endfor %}
    </div>
</section>
{% endfor %}
