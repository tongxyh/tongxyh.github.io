<h1>Projects</h1>

{% for direction in site.data.index.projects %}
<section class="research-project-group">
    <div class="research-project-heading">
        <h2>{{ direction.name }}</h2>
        <p>{{ direction.descr }}</p>
    </div>
    <ul class="research-project-list">
        {% for project in direction.projects %}
        <li>
            <a class="research-project-link" href="{{ project.github }}" target="_blank" rel="noopener noreferrer" aria-label="Open the {{ project.name }} GitHub repository">
                <strong>{{ project.name }}</strong>
                <span>{{ project.descr }}</span>
                <i class="fa fa-github" aria-hidden="true" title="GitHub repository"></i>
            </a>
        </li>
        {% endfor %}
    </ul>
</section>
{% endfor %}
